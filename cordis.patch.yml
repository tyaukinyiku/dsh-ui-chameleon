# dsh-ui-chameleon 组合包层：安装进 profile 后插入此行（安装态唯一点火入口）。
# 聚合入口内部挂载框架与全部 UI pack；用户可在自己的 profile cordis.patch.yml
# 里按 id 覆盖整行 config（覆盖是整行替换，需重写全部键）。
- insert:
  - id: ui-chameleon
    name: 'dsh-ui-chameleon'
    config:
      enabled: true
      defaultPack: default
      defaultTheme: ''
      defaultLayout: ''
      defaultCss: ''
      defaultTokens: {}
      workspaceFileEnabled: true
      workspaceFilePath: .dsh/ui.json
      workspaceFilePollMs: 2000
      observerSlot: conversation.session.header.utilities
      observerId: ui-skins-observer
      observerOrder: 0
