# 联调用 --patch 覆盖层（dsh-ui-chameleon 自洽路径 + 三套演示皮肤）。
# 用法（dsh 仓库内）：pnpm dsh web --patch /home/work/.openclaw/workspace/dsh-ui-chameleon/examples/cordis.patch.local.yml
- insert:
  - id: ui-skins
    name: '/home/work/.openclaw/workspace/dsh-ui-chameleon/packages/ui-skins/src/index.ts'
    config:
      enabled: true
      defaultPack: default
      defaultTheme: ''
      defaultLayout: ''
      defaultCss: ''
      defaultTokens: {}
      workspaceFileEnabled: true
      workspaceFilePath: .dsh/ui.json
      workspaceFilePollMs: 2000
      observerSlot: conversation.session.header.utilities
      observerId: ui-skins-observer
      observerOrder: 0
  - id: ui-pack-default
    name: '/home/work/.openclaw/workspace/dsh-ui-chameleon/packages/ui-pack-default/src/index.ts'
  - id: ui-pack-example
    name: '/home/work/.openclaw/workspace/dsh-ui-chameleon/packages/ui-pack-example/src/index.ts'
  - id: ui-pack-aurora
    name: '/home/work/.openclaw/workspace/dsh-ui-chameleon/packages/ui-pack-aurora/src/index.ts'
  - id: ui-pack-manuscript
    name: '/home/work/.openclaw/workspace/dsh-ui-chameleon/packages/ui-pack-manuscript/src/index.ts'
  - id: ui-pack-terminal
    name: '/home/work/.openclaw/workspace/dsh-ui-chameleon/packages/ui-pack-terminal/src/index.ts'
